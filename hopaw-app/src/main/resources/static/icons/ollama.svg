<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Ollama 品牌色背景（暖橙） -->
  <rect width="100" height="100" rx="20" fill="#C57B57"/>
  <!-- 羊驼简笔（白线） -->
  <g fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- 头部 -->
    <ellipse cx="50" cy="48" rx="16" ry="18" fill="white"/>
    <!-- 耳朵 -->
    <path d="M38 32 L32 18 M62 32 L68 18"/>
    <!-- 眼睛 -->
    <circle cx="43" cy="45" r="2" fill="#C57B57"/>
    <circle cx="57" cy="45" r="2" fill="#C57B57"/>
    <!-- 鼻子 -->
    <ellipse cx="50" cy="56" rx="4" ry="3" fill="#C57B57"/>
    <!-- 身体 -->
    <path d="M35 62 Q30 75, 40 82 L60 82 Q70 75, 65 62"/>
    <!-- 腿 -->
    <path d="M40 82 L38 95 M60 82 L62 95"/>
  </g>
</svg>

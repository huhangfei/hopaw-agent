# Development Environment Configuration
# SQLite Configuration
spring.datasource.url=jdbc:sqlite:agent.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Logging
logging.level.com.agent.hopaw=DEBUG
logging.level.dev.langchain4j.community.store.embedding.jvector=WARN
logging.level.io.github.jbellis=INFO
logging.level.org.mybatis=INFO
logging.level.com.agent.hopaw.infra.mapper=INFO
logging.level.com.agent.hopaw.avatar.mapper=INFO
logging.level.com.zaxxer.hikari.pool.HikariPool=INFO
logging.level.org.springframework=WARN

# 登录验证码开关（true=启用验证码，防止暴力破解密码）
hopaw.captcha.enabled=false
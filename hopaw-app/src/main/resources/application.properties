# Server Configuration
server.port=8080
server.servlet.session.timeout=30d
spring.jackson.time-zone=Asia/Shanghai
spring.profiles.active=dev
# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Multipart File Upload
spring.servlet.multipart.max-file-size=10240MB
spring.servlet.multipart.max-request-size=1024MB

# MyBatis - 让所有 profile 都能扫描到各模块的 mapper XML
# 使用 classpath*:** 通配符匹配 classpath 中所有 mapper 路径
mybatis.mapper-locations=classpath*:mapper/**/*Mapper.xml
mybatis.type-aliases-package=com.agent.hopaw.infra.model.entity,com.agent.hopaw.avatar.entity

# SQLite 并发写入优化（修复并发写入时 SQLITE_BUSY: database is locked）
# journal_mode=WAL：读写不互斥，多线程读库不再阻塞写库（模式持久化在库文件中）
# busy_timeout=30000：写锁被占时排队等待 30 秒（驱动默认仅 3 秒，超时即报错）
# 注：sqlite-jdbc 3.44.1.0 不支持在 JDBC URL 上追加 ?参数（会被当作文件名），必须走连接池属性传递
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.busy_timeout=30000

# 附件管理配置
hopaw.attachment.dir=attachments
hopaw.attachment.url-prefix=/attachments
# Plugin Configuration
agent.plugin.dir=plugins
# 项目空间配置
# 项目空间根目录：所有项目的项目空间目录都放置在此目录下
# 每创建一个项目，会在此目录下根据项目编号创建一个子目录作为该项目的工作空间
hopaw.project.space.dir=project-spaces
# 登录验证码开关（true=启用验证码，防止暴力破解密码）
hopaw.captcha.enabled=true
# Embedded ActiveMQ Artemis
spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.persistent=false
spring.artemis.embedded.data-directory=artemis-data
spring.artemis.broker-url=vm://0
# 仅排除 Artemis 自动配置（我们自己管理 broker），保留 JmsAutoConfiguration（提供 @JmsListener 支持）
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jms.artemis.ArtemisAutoConfiguration


<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="op-tabs(activeTab)" class="cap-tabs">
    <a class="cap-tab" th:classappend="${activeTab == 'token-usage' ? 'active' : ''}" href="/token-usage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        <span>Token使用</span>
    </a>
    <a class="cap-tab" th:classappend="${activeTab == 'attachments' ? 'active' : ''}" href="/attachments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
        <span>附件管理</span>
    </a>
    <a class="cap-tab" th:classappend="${activeTab == 'accounts' ? 'active' : ''}" href="/accounts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>账户管理</span>
    </a>
    <a class="cap-tab" th:classappend="${activeTab == 'session-clean' ? 'active' : ''}" href="/session-clean">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        <span>会话清理</span>
    </a>
    <a class="cap-tab" th:classappend="${activeTab == 'scheduled-tasks' ? 'active' : ''}" href="/scheduled-tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>定时任务</span>
    </a>
    <a class="cap-tab" th:classappend="${activeTab == 'ip-blacklist' ? 'active' : ''}" href="/ip-blacklist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
        </svg>
        <span>IP黑名单</span>
    </a>
    <a class="cap-tab" th:classappend="${activeTab == 'login-log' ? 'active' : ''}" href="/login-log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <span>登录日志</span>
    </a>
    <a class="cap-tab" th:classappend="${activeTab == 'plugins' ? 'active' : ''}" href="/plugins">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
        <span>插件管理</span>
    </a>
    <a class="cap-tab" th:classappend="${activeTab == 'memory-history' ? 'active' : ''}" href="/memory-history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="5" r="2"/>
            <circle cx="5" cy="12" r="2"/>
            <circle cx="19" cy="12" r="2"/>
            <circle cx="8" cy="19" r="2"/>
            <circle cx="16" cy="19" r="2"/>
            <line x1="12" y1="7" x2="5" y2="10"/>
            <line x1="12" y1="7" x2="19" y2="10"/>
            <line x1="7" y1="12" x2="17" y2="12"/>
            <line x1="5" y1="13" x2="8" y2="17"/>
            <line x1="19" y1="13" x2="16" y2="17"/>
            <line x1="10" y1="19" x2="14" y2="19"/>
        </svg>
        <span>记忆历史</span>
    </a>
</div>
</body>
</html>

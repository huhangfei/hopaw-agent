<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/default}">
<head>
    <title>会话清理 - HoPaw</title>
</head>
<body>
<div layout:fragment="pageTitle">🤖 HoPaw - 会话清理</div>

<div class="cap-page" layout:fragment="content">
    <div th:replace="~{fragments/op-tabs :: op-tabs(${activeTab})}"></div>
    <main class="settings-content">
        <div class="settings-panel active" id="tab-session-clean">
            <div class="session-clean-toolbar">
                <div class="session-clean-batch-btns">
                    <button class="btn-save-settings session-clean-btn" id="scBatchClearBtn" onclick="scBatchClear()">一键清理历史</button>
                    <button class="btn-save-settings session-clean-btn session-clean-btn-danger" id="scBatchDeleteBtn" onclick="scBatchDelete()">一键删除</button>
                </div>
                <span class="session-clean-selected-tip" id="scSelectedTip">已选 0 项</span>
            </div>
            <div class="session-clean-card">
                <table class="session-clean-table">
                    <thead>
                    <tr>
                        <th class="sc-col-check"><input type="checkbox" id="scCheckAll" onchange="scToggleCheckAll(this)"></th>
                        <th>会话名称</th>
                        <th>会话类型</th>
                        <th>创建时间</th>
                        <th>最后更新时间</th>
                        <th>消息记录数量</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="scTableBody">
                    </tbody>
                </table>
                <div class="session-clean-empty" id="scEmptyState" style="display:none;">
                    <p>暂无会话</p>
                </div>
                <div class="session-clean-pagination" id="scPagination">
                    <button class="sc-page-btn" id="scPrevBtn" onclick="scPrevPage()">上一页</button>
                    <span class="sc-page-info" id="scPageInfo">1 / 1</span>
                    <button class="sc-page-btn" id="scNextBtn" onclick="scNextPage()">下一页</button>
                    <span class="sc-total-info" id="scTotalInfo">共 0 条</span>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block layout:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/page/cap-tabs.css}">
    <link rel="stylesheet" th:href="@{/css/page/settings.css}">
    <link rel="stylesheet" th:href="@{/css/page/settings-session-clean.css}">
</th:block>

<th:block layout:fragment="extraScripts">
    <script th:src="@{/js/page/settings-common.js}"></script>
    <script th:src="@{/js/page/settings-session-clean.js}"></script>
</th:block>
</body>
</html>

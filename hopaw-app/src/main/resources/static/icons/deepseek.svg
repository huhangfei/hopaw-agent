<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- DeepSeek 品牌色背景（深蓝） -->
  <rect width="100" height="100" rx="20" fill="#1E40AF"/>
  <!-- DeepSeek 标志性鲸鱼简笔（白线勾出） -->
  <g fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- 鲸鱼身体弧线 -->
    <path d="M20 55 Q 35 30, 60 35 Q 78 38, 82 50 Q 80 60, 70 60 Q 60 55, 50 60 Q 40 65, 30 60 Q 22 58, 20 55 Z" fill="white"/>
    <!-- 鲸鱼尾巴 -->
    <path d="M80 50 L88 38 M80 50 L88 62" fill="none"/>
    <!-- 眼睛 -->
    <circle cx="30" cy="50" r="1.5" fill="#1E40AF"/>
  </g>
</svg>

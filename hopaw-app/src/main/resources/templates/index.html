<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/default}">
<head>
    <title>🤖 HoPaw</title>
</head>
<body>
<div layout:fragment="pageTitle">🤖 HoPaw - 会话</div>

<div class="chat-wrapper" layout:fragment="content">
    <main class="chat-area">
        <div th:if="${selectedAgent == null}" class="chat-empty-state">
            <div class="chat-empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M9 9l6 6"/>
                    <path d="M15 9l-6 6"/>
                </svg>
            </div>
            <h3 class="chat-empty-title">暂无可用智能体</h3>
            <p class="chat-empty-desc">请先前往智能体管理页面创建并启用智能体</p>
            <a href="/agents" class="chat-empty-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                前往智能体管理
            </a>
        </div>
        <div th:if="${selectedAgent != null}" class="chat-header">
            <!-- 运行状态双色光晕背景层：左(已用时间)与右(超时时间)光晕在分界线相遇，分界线 = 已用/(已用+超时) -->
            <div class="chat-header-glow" id="chatHeaderGlow" aria-hidden="true">
                <div class="chat-header-glow-line"></div>
            </div>
            <div class="chat-header-title">
                <span class="chat-header-desc" id="chat-header-desc" th:text="${currentSessionTitle}"></span>
            </div>
            <div class="chat-header-actions">
                <!-- 运行状态计时器：已运行时长 + 看门狗剩余时间（运行中显示） -->
                <div class="chat-header-timer" id="chatHeaderTimer"
                     th:classappend="${agentExecutorState ? '' : 'hide'}">
                    <span class="chat-header-timer-dot"></span>
                    <span class="chat-header-timer-text">运行中 <span id="runningElapsed"></span></span>
                    <span class="chat-header-timer-countdown" id="runningCountdown"></span>
                </div>
                <button class="btn-add-header" onclick="createNewSession()" title="新会话">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    新会话
                </button>
                <div class="header-dropdown">
                    <button class="btn-more" title="更多操作">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                        </svg>
                    </button>
                    <div class="dropdown-menu">
                        <div class="dropdown-menu-inner">
                            <button class="dropdown-item" onclick="showAddAgentModal()">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                                </svg>
                                添加 Agent
                            </button>
                            <button class="dropdown-item"
                                    th:attr="onclick=|editCurrentAgent()|">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                                </svg>
                                编辑 Agent
                            </button>
                            <button class="dropdown-item" onclick="showSessionMemoryModal()">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="#f5a623">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                                </svg>
                                会话记忆
                            </button>
                            <button class="dropdown-item" onclick="showRequestLogModal()">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="#e53935">
                                    <path d="M20 8h-2.81c-.45-.78-1.07-1.45-1.82-1.96L17 4.41 15.59 3l-2.17 2.17C12.96 5.06 12.49 5 12 5c-.49 0-.96.06-1.41.15L8.41 3 7 4.41l1.62 1.63C7.88 6.55 7.26 7.22 6.81 8H4v2h2.09c-.05.33-.09.66-.09 1v1H4v2h2v1c0 .34.04.67.09 1H4v2h2.81c1.04 1.79 2.97 3 5.19 3s4.15-1.21 5.19-3H20v-2h-2.09c.05-.33.09-.66.09-1v-1h2v-2h-2v-1c0-.34-.04-.67-.09-1H20V8zm-6 8h-4v-2h4v2zm0-4h-4v-2h4v2z"/>
                                </svg>
                                请求日志
                            </button>
                            <button class="dropdown-item" th:attr="onclick=|clearHistory('${currentSessionId}')|">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                                    <path d="M19.36 2.72l1.42 1.42-5.72 5.71c1.07 1.54 1.22 3.39.32 4.59L9.06 8.12c1.2-.9 3.05-.75 4.59.32l5.71-5.72zM5.93 17.57c-2.01-2.01-3.24-4.41-3.58-6.65l4.88-2.09 7.44 7.44-2.09 4.88c-2.24-.34-4.64-1.57-6.65-3.58z"/>
                                </svg>
                                清空对话
                            </button>
                            <button class="dropdown-item dropdown-item-danger" th:attr="onclick=|deleteSession('${currentSessionId}')|">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                                </svg>
                                删除会话
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${selectedAgent != null}" class="chat-messages-wrap">
            <div class="chat-messages" id="chatMessages">
            <!-- 消息区首次加载与向上翻页均由前端 JS 渲染（/api/session/{sessionId}/history/latest） -->
            <div class="empty-state" id="chatHistoryEmptyState">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            <p>有什么问题尽管问。</p>
        </div>
        </div>
        <!-- 用户消息导航：每个圆点对应一组连续的用户消息，悬停预览、点击定位 -->
        <div class="user-msg-nav" id="userMsgNav"></div>
        </div>
        <div th:if="${selectedAgent != null}" class="chat-input-area">
            <form th:action="@{/chat}" method="post" class="chat-form" id="chatForm">
                <input type="hidden" name="agentId" th:value="${selectedAgent.id}">
                <div class="chat-input-wrapper" th:classappend="${agentExecutorState} ? 'disabled' : ''">
                    <div class="file-preview-area" id="filePreviewArea"></div>
                    <textarea name="message" id="messageInput" placeholder="输入消息..." required
                              th:disabled="${agentExecutorState}" rows="2"></textarea>
                    <div class="chat-input-tools">
                        <select class="agent-select agent-select-toolbar" onchange="selectAgent(this)">
                            <option th:each="a : ${agents}"
                                    th:value="${a.id}"
                                    th:text="${a.name}"
                                    th:data-desc="${a.description}"
                                    th:selected="${selectedAgentId == a.id}"></option>
                        </select>
                        <div class="model-dropdown" id="modelDropdown">
                            <button type="button" class="chat-btn-model" id="modelSelectBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14"
                                     height="14">
                                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                                    <line x1="8" y1="21" x2="16" y2="21"/>
                                    <line x1="12" y1="17" x2="12" y2="21"/>
                                </svg>
                                <span id="selectedModelName">模型</span>
                            </button>
                            <div class="model-dropdown-menu" id="modelDropdownMenu">
                                <div class="model-dropdown-list" id="modelProviderList"></div>
                            </div>
                            <input type="hidden" id="selectedAiModelId" th:value="${selectedAiModelId}"/>
                            <input type="hidden" id="currentSessionId" th:value="${currentSessionId}" />
                        </div>
                        <div class="skills-dropdown" id="skillsDropdown">
                            <button type="button" class="chat-btn-skill" id="skillSelectBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14"
                                     height="14">
                                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                                </svg>
                                技能
                            </button>
                            <div class="skills-dropdown-menu" id="skillsDropdownMenu">
                                <div class="skills-dropdown-list" id="skillsCheckboxList"></div>
                            </div>
                        </div>
                        <button type="button" class="chat-btn-attach" id="attachBtn" title="添加附件">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                            </svg>
                        </button>
                        <input type="file" id="fileInput" style="display:none" multiple>
                        <button type="button" class="chat-btn-deep" id="deepThinkBtn"
                                th:attr="data-agent-id=${selectedAgent.id}, data-enabled=${selectedAgent.enableThinking}"
                                th:classappend="${selectedAgent.enableThinking ? 'active' : ''}">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                            </svg>
                            深度思考
                        </button>
                        <div class="tool-permission-dropdown" id="toolPermissionDropdown">
                            <button type="button" class="chat-btn-permission" id="toolPermissionBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                                </svg>
                                <span id="toolPermissionLabel">智能调用</span>
                            </button>
                            <div class="tool-permission-dropdown-menu" id="toolPermissionDropdownMenu">
                                <div class="tool-permission-item user_control" data-value="user_control" onclick="selectToolPermission('user_control')">
                                    <div class="tool-permission-item-main">
                                        <span class="tool-permission-item-dot user_control"></span>
                                        <span class="tool-permission-item-name">用户控制</span>
                                        <span class="tool-permission-item-check" id="check_user_control">✓</span>
                                    </div>
                                    <div class="tool-permission-item-desc">除安全工具外，每次工具调用均需你确认后执行</div>
                                </div>
                                <div class="tool-permission-item smart_call" data-value="smart_call" onclick="selectToolPermission('smart_call')">
                                    <div class="tool-permission-item-main">
                                        <span class="tool-permission-item-dot smart_call"></span>
                                        <span class="tool-permission-item-name">智能调用</span>
                                        <span class="tool-permission-item-check" id="check_smart_call">✓</span>
                                    </div>
                                    <div class="tool-permission-item-desc">安全工具自动执行，其余智能判断风险，高风险才需确认</div>
                                </div>
                                <div class="tool-permission-item auto" data-value="auto" onclick="selectToolPermission('auto')">
                                    <div class="tool-permission-item-main">
                                        <span class="tool-permission-item-dot auto"></span>
                                        <span class="tool-permission-item-name">完全自动</span>
                                        <span class="tool-permission-item-check" id="check_auto">✓</span>
                                    </div>
                                    <div class="tool-permission-item-desc">所有工具调用直接执行，无需确认</div>
                                </div>
                            </div>
                        </div>
                        <!-- 发送 / 停止按钮合并到输入框右下角：运行中显示停止按钮，空闲显示发送按钮 -->
                        <button type="submit" id="sendBtn" class="chat-form-send-button" title="发送"
                                th:classappend="${agentExecutorState ? 'hide' : ''}">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                            </svg>
                        </button>
                        <button type="button" id="runningBtn" class="chat-form-running-btn" title="停止运行"
                                th:classappend="${agentExecutorState ? '' : 'hide'}" onclick="stopCurrentSession()">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13">
                                <rect x="6" y="6" width="12" height="12" rx="2"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>
    <aside class="tool-panel">
        <div class="tool-panel-section tool-panel-top">
            <div class="tool-panel-title session-panel-title">
                <span>会话列表</span>
                <div class="session-type-filter" id="sessionTypeFilter">
                    <span class="session-type-tab active" data-type="chat" onclick="filterSessionsByType('chat')">聊天</span>
                    <span class="session-type-tab" data-type="project" onclick="filterSessionsByType('project')">项目</span>
                    <span class="session-type-tab" data-type="task" onclick="filterSessionsByType('task')">任务</span>
                </div>
            </div>
            <div class="tool-panel-body session-list-body" id="sessionList">
            </div>
        </div>
        <div class="tool-panel-section tool-panel-mid">
            <div class="tool-panel-title">工具执行列表
                <span id="toolExecStats" style="font-size:11px;font-weight:400;margin-left:8px;float: right;" title="会话调用总数 / 执行器已执行 / 执行器上限"></span>
            </div>
            <!-- 工具执行列表由前端 JS 随消息历史一并渲染 -->
            <div class="tool-panel-body" id="toolExecList">
            </div>
        </div>
        <div class="tool-panel-section tool-panel-bottom">
            <div class="tool-panel-title" style="height: 40px;">会话Token
                <span id="tokenDailyStats" style="font-size:11px;font-weight:400;margin-left:8px;float: right;"></span>
                <span id="tokenLastStats" style="font-size:11px;font-weight:400;margin-left:8px;float: right;"></span>
            </div>
            <div class="tool-panel-body" id="tokenUsage">
            </div>
        </div>
    </aside>
    <div class="avatar-widget" id="avatarWidget" th:if="${!avatarDisabled}">
        <button type="button" class="avatar-minimize-btn" id="avatarMinimizeBtn" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </button>
        <div class="avatar-bubble-stack" id="avatarBubbleStack" aria-live="polite"></div>
        <div class="avatar-intimacy-card" id="avatarIntimacyCard" aria-hidden="true">
            <div class="avatar-intimacy-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                    <path d="M12 21s-7.5-4.6-9.5-9.2C1.1 8.3 3 5 6.3 5c1.9 0 3.3 1 3.7 2.2.4-1.2 1.8-2.2 3.7-2.2 3.3 0 5.2 3.3 3.8 6.8C19.5 16.4 12 21 12 21z"/>
                </svg>
            </div>
            <div class="avatar-intimacy-body">
                <div class="avatar-intimacy-row avatar-intimacy-level-row">
                    <span class="avatar-intimacy-label">亲密度</span>
                    <span class="avatar-intimacy-value">Lv.<span id="avatarIntimacyLevel">0</span> · <span id="avatarIntimacyTitle">陌生人</span></span>
                </div>
                <div class="avatar-intimacy-progress">
                    <div class="avatar-intimacy-progress-bar" id="avatarIntimacyProgress" style="width:0%"></div>
                </div>
            </div>
            <div class="avatar-intimacy-tail"></div>
        </div>
        <canvas class="avatar-canvas" id="avatarCanvas" width="250" height="250"></canvas>
        <button type="button" class="avatar-restore-btn" id="avatarRestoreBtn" title="展开" aria-label="展开">
            <img th:src="@{/images/avatar.png}" alt="avatar"/>
        </button>
        <button type="button" class="avatar-settings-btn" id="avatarSettingsBtn" title="虚拟人设置" aria-label="虚拟人设置">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
        <button type="button" class="avatar-change-model-btn" id="avatarChangeModelBtn" title="换装" aria-label="换装">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
            </svg>
        </button>
    </div>

    <!-- 会话记忆列表弹框：长文本仅展示前20字符，点击详情查看全文 -->
    <div class="modal-overlay" id="sessionMemoryModal">
        <div class="modal modal-wide">
            <div class="modal-header">
                <h3>会话记忆</h3>
                <button class="modal-close" onclick="hideSessionMemoryModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="session-memory-list" id="sessionMemoryList"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="hideSessionMemoryModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 会话记忆详情弹框 -->
    <div class="modal-overlay" id="sessionMemoryDetailModal">
        <div class="modal modal-wide">
            <div class="modal-header">
                <h3>记忆详情</h3>
                <button class="modal-close" onclick="hideSessionMemoryDetailModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="sessionMemoryDetailBody"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="hideSessionMemoryDetailModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 请求日志列表弹框：展示会话内所有模型请求/响应，可点击详情查看完整 JSON -->
    <div class="modal-overlay" id="requestLogModal">
        <div class="modal modal-wide">
            <div class="modal-header">
                <h3 id="requestLogTitle">请求日志</h3>
                <button class="modal-close" onclick="hideRequestLogModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="request-log-list" id="requestLogList"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-danger request-log-clear-btn" id="requestLogClearBtn"
                        onclick="clearRequestLogs()">清理本会话日志</button>
                <button type="button" class="btn-cancel" onclick="hideRequestLogModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 请求日志详情弹框：完整请求/响应 JSON -->
    <div class="modal-overlay" id="requestLogDetailModal">
        <div class="modal modal-wide">
            <div class="modal-header">
                <h3>请求详情</h3>
                <button class="modal-close" onclick="hideRequestLogDetailModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="requestLogDetailBody"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="hideRequestLogDetailModal()">关闭</button>
            </div>
        </div>
    </div>
</div>


<th:block layout:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/page/agent-form.css}">

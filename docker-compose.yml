# hopaw-agent 容器编排
# 使用：先执行 docker-build.bat 构建镜像，再 docker-compose up -d
# 数据持久化：SQLite 库与全部运行时目录统一挂载在./data 下，容器重建不丢数据
services:
  hopaw-agent:
    image: hopaw-agent:1.0.0
    build: .
    container_name: hopaw-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms1g -Xmx2g"
      # 运行时目录统一重定向到 /app/data（环境变量优先级高于 application-*.properties�?
      SPRING_DATASOURCE_URL: jdbc:sqlite:/app/data/agent.db
      AGENT_PLUGIN_DIR: /app/data/plugins
      HOPAW_ATTACHMENT_DIR: /app/data/attachments
      HOPAW_PROJECT_SPACE_DIR: /app/data/project-spaces
      HOPAW_EXPORT_DIR: /app/data/exports
      HOPAW_ENCRYPTION_KEY_PATH: /app/data/encryption.key
    volumes:
      - ./data:/app/data
      # 日志目录默认为相对路径 logs（可在系统设置中改为 /app/data/logs），挂载兜底
      - ./data/logs:/app/logs
      # 临时文件目录默认为相对路径 temp-file（可在系统设置中改为 /app/data/temp-file），挂载兜底
      - ./data/temp-file:/app/temp-file
      # 导出目录默认为相对路径 exports（可在系统设置中改为 /app/data/exports），挂载兜底
      - ./data/exports:/app/exports
      # 技能目录默认为相对路径 skills（可在系统设置中改为 /app/data/skills），挂载兜底
      - ./data/skills:/app/skills
      #头像
      - ./data/avatars:/app/avatars
      # Playwright 浏览器缓存持久化（避免每次容器重建重下 970MB）
      - ./data/ms-playwright:/root/.cache/ms-playwright
    # JVM 默认堆为限制值的 25%；Chromium 网页插件运行时渲染页面还需数百 MB 余量，
    # 过低会导致浏览器安装/渲染时被 OOM Kill（exit 137），按需调整
    mem_limit: 3g

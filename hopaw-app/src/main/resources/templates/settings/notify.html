<th:block th:fragment="content" xmlns:th="http://www.thymeleaf.org">
<div class="settings-panel active" id="tab-notify">
    <div class="settings-form notify-channel-manage-form">
        <div class="notify-channel-list" id="notifyChannelList"></div>
        <div id="notifyChannelFormBox" style="display:none; margin-top:12px; border-top:1px solid #eee; padding-top:12px;">
            <form id="notifyChannelForm">
                <input type="hidden" id="notifyChannelId">
                <div class="form-group">
                    <label for="notifyChannelName">渠道名称 *</label>
                    <input type="text" id="notifyChannelName" class="settings-input" placeholder="如：项目通知钉钉群">
                </div>
                <div class="form-group">
                    <label for="notifyChannelType">通知方式 *</label>
                    <select id="notifyChannelType" class="settings-input" onchange="onNotifyChannelTypeChange()">
                        <option value="dingtalk">钉钉群</option>
                        <option value="feishu">飞书</option>
                        <option value="email">邮件</option>
                        <option value="webhook">Webhook</option>
                    </select>
                </div>
                <div id="notifyChannelConfigBox"></div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="notifyChannelEnabled" checked>
                        启用该渠道
                    </label>
                </div>
            </form>
            <div class="notify-channel-form-btns">
                <button class="btn-cancel" onclick="closeNotifyChannelForm()">取消</button>
                <button class="btn-submit" onclick="saveNotifyChannel()">保存</button>
            </div>
        </div>
        <button type="button" class="notify-channel-add-btn" id="notifyChannelAddBtn" onclick="openNotifyChannelForm()">+ 新增渠道</button>
        <small class="form-hint">通知渠道支持钉钉群/飞书/邮件/Webhook；在项目表单中勾选渠道并选择通知事项后，项目关键事件将向所选渠道发送通知</small>
    </div>
</div>
</th:block>

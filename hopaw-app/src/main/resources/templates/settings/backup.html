<th:block th:fragment="content" xmlns:th="http://www.thymeleaf.org">
<div class="settings-panel active" id="tab-backup">
    <div class="settings-form">
        <h3 class="settings-section-title">数据备份</h3>
        <p class="settings-section-desc">选择要备份的数据内容，点击备份按钮导出为ZIP文件。</p>

        <div class="backup-options">
            <div class="backup-option">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="exportSysConfig" checked>
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-label">系统配置</span>
                </label>
                <span class="backup-option-desc">导出系统配置表 (sys_config)</span>
            </div>

            <div class="backup-option">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="exportModelConfig" checked>
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-label">模型配置</span>
                </label>
                <span class="backup-option-desc">导出模型提供商表 (ai_model_providers) 和模型表 (ai_models)</span>
            </div>

            <div class="backup-option">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="exportAgentConfig" checked>
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-label">智能体配置</span>
                </label>
                <span class="backup-option-desc">导出智能体表 (agents) 和头像配置表 (agent_avatar_config)</span>
            </div>
        </div>

        <div class="backup-info">
            <div class="backup-info-item">
                <span class="backup-info-icon">?</span>
                <span>敏感字段（如 API 密钥）将以明文形式导出，加密密钥不会包含在备份文件中。请妥善保管备份文件。</span>
            </div>
        </div>

        <div class="backup-option" style="margin-top: 16px; display: flex; align-items: center; gap: 10px;">
            <label class="checkbox-wrapper">
                <input type="checkbox" id="usePassword">
                <span class="checkbox-custom"></span>
                <span class="checkbox-label">设置解压密码</span>
            </label>
            <input type="password" id="backupPassword" placeholder="留空则不加密"
                   style="flex: 1; padding: 6px 10px; border: 1px solid var(--border-color, #ccc); border-radius: 4px; display: none;">
        </div>

        <div class="settings-actions">
            <button class="btn-save-settings" id="backupBtn" onclick="startBackup()">
                备份数据
            </button>
            <button class="btn-save-settings" id="restoreBtn" onclick="showRestoreDialog()"
                    style="margin-left: 10px; background: var(--secondary-btn-bg, #6c757d);">
                导入备份
            </button>
        </div>
    </div>
</div>

<!-- 导入备份对话框 -->
<div id="restoreDialog" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:var(--bg-color,#fff); border-radius:8px; padding:24px; width:420px; max-width:90%; box-shadow:0 8px 24px rgba(0,0,0,0.2);">
        <h3 style="margin:0 0 16px 0; font-size:16px;">导入备份</h3>
        <div style="margin-bottom:12px;">
            <label style="display:block; margin-bottom:6px; font-size:13px;">备份文件 (.zip)</label>
            <input type="file" id="restoreFile" accept=".zip"
                   style="width:100%; padding:6px; border:1px solid var(--border-color,#ccc); border-radius:4px;">
        </div>
        <div style="margin-bottom:16px;">
            <label style="display:block; margin-bottom:6px; font-size:13px;">解压密码（如未加密请留空）</label>
            <input type="password" id="restorePassword" placeholder="无密码可留空"
                   style="width:100%; padding:6px 10px; border:1px solid var(--border-color,#ccc); border-radius:4px;">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button onclick="closeRestoreDialog()"
                    style="padding:6px 16px; border:1px solid var(--border-color,#ccc); border-radius:4px; background:transparent; cursor:pointer;">取消</button>
            <button id="confirmRestoreBtn" onclick="confirmRestore()"
                    style="padding:6px 16px; border:none; border-radius:4px; background:var(--primary-btn-bg,#007bff); color:#fff; cursor:pointer;">导入</button>
        </div>
    </div>
</div>
</th:block>

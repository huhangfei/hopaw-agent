version: '3.8'

services:
  hopaw-plugin-repo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hopaw-plugin-repo
    restart: unless-stopped
    user: "0:0"
    ports:
      - "8081:8081"
    environment:
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms1g -Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    volumes:
      - ./logs:/app/logs
      - ./plugin-packages:/app/plugin-packages
      - ./data:/app/data
      - ./config:/app/config
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    networks:
      - hopaw-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hopaw-network:
    driver: bridge

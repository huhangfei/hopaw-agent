server.port=8081
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
plugin-repo.packages-dir=plugin-packages
plugin-repo.db.path=data/plugin-repo.db

# 鏃ュ織閰嶇疆
logging.file.name=logs/plugin-repo.log
logging.file.max-size=50MB
logging.file.max-history=30
logging.level.root=INFO
logging.level.com.agent.hopaw=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# 閭欢閰嶇疆
mail.host=smtp.example.com
mail.port=587
mail.username=your-email@example.com
mail.password=your-password
mail.from=your-email@example.com

server.servlet.session.cookie.name=PLUGIN_REPO_SESSION
  
# upload file size limit  
spring.servlet.multipart.max-file-size=500MB  
spring.servlet.multipart.max-request-size=500MB  
server.tomcat.max-http-form-post-size=500MB  

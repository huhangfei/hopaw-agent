<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="addAgentModal(vendors)" class="modal-overlay" id="addAgentModalFragment">
    <div class="modal">
        <div class="modal-header">
            <h3>添加新 Agent</h3>
            <button class="modal-close" onclick="hideAddModalFragment()">&times;</button>
        </div>
        <div class="modal-body">
            <form th:action="@{/agent/create}" method="post" class="modal-form" id="addAgentFormFragment" onsubmit="return false;">
                <div class="form-left">
                    <div class="form-group">
                        <label>名称 *</label>
                        <input type="text" name="name" placeholder="输入 Agent 名称" required>
                    </div>
                    <div class="form-group">
                        <label>描述 *</label>
                        <textarea name="description" placeholder="输入 Agent 描述" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>模型 *</label>
                        <div class="flex-container">
                            <select id="addProviderSelectFragment" class="model-select" required>
                                <option value="">选择提供商</option>
                            </select>
                            <select name="aiModelId" id="addModelSelectFragment" class="model-select" required
                                    onchange="onAgentModelSelectChange('add')">
                                <option value="">先选提供商</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>最大记忆（Token）</label>
                            <input type="number" name="maxMemoryTokens" value="20480" min="1024" max="1048576"
                                   placeholder="20480">
                        </div>
                        <div class="form-group">
                            <label>工具调用最大轮次</label>
                            <input type="number" name="maxToolInvocations" value="500" min="-1" max="50000000"
                                   placeholder="500" title="默认 500；填 -1 表示不限制">
                            <small class="form-hint" style="color:#888;font-size:12px;">默认 500，-1 表示不限制</small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <div class="toggle-wrapper">
                                <input type="hidden" name="enableThinking" id="addEnableThinkingFragment" value="true">
                                <label class="toggle">
                                    <input type="checkbox" checked
                                           onchange="document.getElementById('addEnableThinkingFragment').value=this.checked?'true':'false'">
                                    <span class="slider"></span>
                                </label>
                                <span class="toggle-label">启用思考</span>
                            </div>
                        </div>
                        <div class="form-group form-inline reasoning-effort-group">
                            <label>思考强度</label>
                            <select name="reasoningEffort" id="addReasoningEffortFragment">
                                <option th:each="e : ${reasoningEfforts}" th:value="${e.code}" th:text="${e.name}"
                                        th:selected="${e.code == 'high'}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <div class="temp-slider-header">
                                <label>创造力</label>
                                <span class="temp-slider-value" id="addTemperatureValueFragment">0.5</span>
                            </div>
                            <div class="temp-slider">
                                <span class="temp-slider-bound">严谨 0.0</span>
                                <input type="range" name="temperature" id="addTemperatureFragment" min="0" max="1"
                                       step="0.1" value="0.5"
                                       oninput="document.getElementById('addTemperatureValueFragment').textContent=this.value">
                                <span class="temp-slider-bound">创造性 1.0</span>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <div class="toggle-wrapper">
                                <input type="hidden" name="vectorToolSearch" id="addVectorToolSearchFragment" value="true">
                                <label class="toggle">
                                    <input type="checkbox" checked
                                           onchange="document.getElementById('addVectorToolSearchFragment').value=this.checked?'true':'false';document.getElementById('addVectorToolSearchResultsGroupFragment').style.display=this.checked?'':'none'">
                                    <span class="slider"></span>
                                </label>
                                <span class="toggle-label">启用工具搜索</span>
                            </div>
                        </div>
                        <div class="form-group form-inline" id="addVectorToolSearchResultsGroupFragment">
                            <label>最大数量</label>
                            <input type="number" name="vectorToolSearchMaxResults" value="10" min="1" max="500"
                                   placeholder="10">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <div class="toggle-wrapper">
                                <input type="hidden" name="enableAllTools" id="addEnableAllToolsFragment" value="false">
                                <label class="toggle">
                                    <input type="checkbox" id="addEnableAllToolsCheckboxFragment"
                                           onchange="toggleAllTools('add')">
                                    <span class="slider"></span>
                                </label>
                                <span class="toggle-label">允许使用所有工具</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-right" id="addToolListContainerFragment">
                    <div class="form-group">
                        <div class="tool-header">
                            <label id="addToolPanelTitleFragment">工具</label>
                            <div class="tool-toggle-bar">
                                <button type="button" class="btn-tool-toggle"
                                        onclick="selectAllTools('#addAgentModalFragment .checkbox-group')">全选
                                </button>
                                <button type="button" class="btn-tool-toggle"
                                        onclick="deselectAllTools('#addAgentModalFragment .checkbox-group')">取消
                                </button>
                            </div>
                        </div>
                        <div class="tool-mode-hint tool-mode-hint-include" id="addToolModeHintFragment">
                            勾选该智能体可以使用的工具
                        </div>
                        <div class="checkbox-group">
                            <!-- 按插件分组（一级），插件下为其工具集（二级） -->
                            <div th:each="p : ${plugins}" class="tool-group">
                                <div class="tool-group-header">
                                    <span class="tool-group-name" th:text="${p.name}"></span>
                                    <span class="tool-group-version" th:if="${p.version != null and !p.version.isEmpty()}"
                                          th:text="|v${p.version}|"></span>
                                    <span class="tool-group-badge badge-disabled" th:unless="${p.enabled}">插件已禁用</span>
                                </div>
                                <th:block th:if="${p.enabled}">
                                    <th:block th:replace="~{fragment/tool-checkbox :: toolSetLabels(${pluginToolSets.get(p.id)}, '')}"/>
                                </th:block>
                                <th:block th:unless="${p.enabled}">
                                    <th:block th:replace="~{fragment/tool-checkbox :: unavailableToolSetLabels(${p.toolSetNames}, true)}"/>
                                </th:block>
                            </div>
                            <!-- 内置工具：无插件父节点 -->
                            <div class="tool-group" th:if="${not #lists.isEmpty(builtinToolSets)}">
                                <div class="tool-group-header">
                                    <span class="tool-group-name">内置工具</span>
                                </div>
                                <th:block th:replace="~{fragment/tool-checkbox :: toolSetLabels(${builtinToolSets}, '')}"/>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-cancel" onclick="hideAddModalFragment()">取消</button>
            <button type="button" class="btn-submit" onclick="submitAddAgentForm(document.getElementById('addAgentFormFragment'))">创建</button>
        </div>
    </div>
</div>
<div th:fragment="editAgentModal (agent, vendors, modelsMap)" class="modal-overlay" id="editAgentModalFragment">
    <div class="modal">
        <div class="modal-header">
            <h3>编辑 Agent</h3>
            <button class="modal-close" onclick="hideEditModalFragment()">&times;</button>
        </div>
        <div class="modal-body">
            <form th:action="@{/agent/update}" method="post" class="modal-form" id="editAgentFormFragment" onsubmit="return false;">
                <input type="hidden" name="id" id="editAgentIdFragment" th:value="${agent.id}">
                <input type="hidden" name="avatar" th:value="${agent.avatar}">
                <div class="form-left">
                    <div class="form-group">
                        <label>名称</label>
                        <input type="text" name="name" id="editAgentNameFragment" th:value="${agent.name}"
                               placeholder="输入 Agent 名称" required>
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <textarea name="description" id="editAgentDescriptionFragment"
                                  th:text="${agent.description}"
                                  placeholder="输入 Agent 描述" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>模型 *</label>
                        <div class="flex-container">
                            <input type="hidden" id="editModelProviderId" th:value="${aiModelProviderId}">
                            <input type="hidden" id="editModelId" th:value="${aiModelId}">
                            <select id="editProviderSelectFragment" class="model-select" required>
                                <option value="">选择提供商</option>
                            </select>
                            <select name="aiModelId" id="editModelSelectFragment" class="model-select" required
                                    onchange="onAgentModelSelectChange('edit')">
                                <option value="">先选提供商</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>最大记忆（Token）</label>
                            <input type="number" name="maxMemoryTokens" id="editMaxMemoryTokensFragment"
                                   th:value="${agent.maxMemoryTokens != null ? agent.maxMemoryTokens : 20480}"
                                   min="1024" max="1048576" placeholder="20480">
                        </div>
                        <div class="form-group">
                            <label>工具调用最大轮次</label>
                            <input type="number" name="maxToolInvocations" id="editMaxToolInvocationsFragment"
                                   th:value="${agent.maxToolInvocations != null ? agent.maxToolInvocations : 500}"
                                   min="-1" max="50000000" placeholder="500" title="默认 500；填 -1 表示不限制">
                            <small class="form-hint" style="color:#888;font-size:12px;">默认 500，-1 表示不限制</small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <div class="toggle-wrapper">
                                <input type="hidden" name="enableThinking" id="editEnableThinkingFragment"
                                       th:value="${agent.enableThinking != null ? agent.enableThinking : true}">
                                <label class="toggle">
                                    <input type="checkbox" id="editEnableThinkingCheckboxFragment"
                                           th:checked="${agent.enableThinking == null || agent.enableThinking}"
                                           onchange="document.getElementById('editEnableThinkingFragment').value=this.checked?'true':'false'">
                                    <span class="slider"></span>
                                </label>
                                <span class="toggle-label">启用思考</span>
                            </div>
                        </div>
                        <div class="form-group form-inline reasoning-effort-group">
                            <label>思考强度</label>
                            <select name="reasoningEffort" id="editReasoningEffortFragment">
                                <option th:each="e : ${reasoningEfforts}" th:value="${e.code}" th:text="${e.name}"
                                        th:selected="${e.code == (agent.reasoningEffort != null and !#strings.isEmpty(agent.reasoningEffort) ? agent.reasoningEffort : 'high')}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <div class="temp-slider-header">
                                <label>创造力</label>
                                <span class="temp-slider-value" id="editTemperatureValueFragment"
                                      th:text="${agent.temperature != null ? agent.temperature : 0.5}">0.5</span>
                            </div>
                            <div class="temp-slider">
                                <span class="temp-slider-bound">严谨 0.0</span>
                                <input type="range" name="temperature" id="editTemperatureFragment" min="0" max="1"
                                       step="0.1" th:value="${agent.temperature != null ? agent.temperature : 0.5}"
                                       oninput="document.getElementById('editTemperatureValueFragment').textContent=this.value">
                                <span class="temp-slider-bound">创造性 1.0</span>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <div class="toggle-wrapper">
                                <input type="hidden" name="vectorToolSearch" id="editVectorToolSearchFragment"
                                       th:value="${agent.vectorToolSearch != null ? agent.vectorToolSearch : true}">
                                <label class="toggle">
                                    <input type="checkbox" id="editVectorToolSearchCheckboxFragment"
                                           th:checked="${agent.vectorToolSearch == null || agent.vectorToolSearch}"
                                           onchange="document.getElementById('editVectorToolSearchFragment').value=this.checked?'true':'false';document.getElementById('editVectorToolSearchResultsGroupFragment').style.display=this.checked?'':'none'">
                                    <span class="slider"></span>
                                </label>
                                <span class="toggle-label">启用工具搜索</span>
                            </div>
                        </div>
                        <div class="form-group form-inline" id="editVectorToolSearchResultsGroupFragment">
                            <label>最大数量</label>
                            <input type="number" name="vectorToolSearchMaxResults"
                                   id="editVectorToolSearchMaxResultsFragment"
                                   th:value="${agent.vectorToolSearchMaxResults != null ? agent.vectorToolSearchMaxResults : 10}"
                                   min="1" max="500" placeholder="10">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <div class="toggle-wrapper">
                                <input type="hidden" name="enableAllTools" id="editEnableAllToolsFragment"
                                       th:value="${agent.enableAllTools != null ? agent.enableAllTools : false}">
                                <label class="toggle">
                                    <input type="checkbox" id="editEnableAllToolsCheckboxFragment"
                                           th:checked="${agent.enableAllTools}"
                                           onchange="toggleAllTools('edit')">
                                    <span class="slider"></span>
                                </label>
                                <span class="toggle-label">允许使用所有工具</span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 允许全部工具时仍显示工具列表：此时勾选的是要排除的工具（exclude-mode） -->
                <div class="form-right" id="editToolListContainerFragment"
                     th:classappend="${agent.enableAllTools ? 'exclude-mode' : ''}">
                    <div class="form-group">
                        <div class="tool-header">
                            <label id="editToolPanelTitleFragment"
                                   th:text="${agent.enableAllTools ? '排除工具' : '工具'}">工具</label>
                            <div class="tool-toggle-bar">
                                <button type="button" class="btn-tool-toggle"
                                        onclick="selectAllTools('#editToolListFragment')">全选
                                </button>
                                <button type="button" class="btn-tool-toggle"
                                        onclick="deselectAllTools('#editToolListFragment')">取消
                                </button>
                            </div>
                        </div>
                        <div th:class="${agent.enableAllTools ? 'tool-mode-hint tool-mode-hint-exclude' : 'tool-mode-hint tool-mode-hint-include'}"
                             id="editToolModeHintFragment"
                             th:text="${agent.enableAllTools ? '已允许使用所有工具：此处勾选的工具将被排除，其余工具全部可用' : '勾选该智能体可以使用的工具'}">
                            勾选该智能体可以使用的工具
                        </div>
                        <div class="checkbox-group" id="editToolListFragment">
                            <!-- 按插件分组（一级），插件下为其工具集（二级） -->
                            <div th:each="p : ${plugins}" class="tool-group">
                                <div class="tool-group-header">
                                    <span class="tool-group-name" th:text="${p.name}"></span>
                                    <span class="tool-group-version" th:if="${p.version != null and !p.version.isEmpty()}"
                                          th:text="|v${p.version}|"></span>
                                    <span class="tool-group-badge badge-disabled" th:unless="${p.enabled}">插件已禁用</span>
                                </div>
                                <th:block th:if="${p.enabled}">
                                    <label th:each="ts : ${pluginToolSets.get(p.id)}" class="checkbox-item"
                                           th:classappend="${ts.enabled ? null : ' checkbox-item-unavailable'}">
                                        <div class="tool-item-row">
                                            <input type="checkbox" name="tools" th:value="${ts.name}"
                                                   class="edit-tool-checkbox-fragment"
                                                   th:disabled="${not ts.enabled}"
                                                   th:checked="${agent.tools != null and #strings.contains(agent.tools, ts.name)}">
                                            <div class="tool-item-icon">
                                                <th:block th:if="${ts.iconIsSvgCode()}">
                                                    <span th:utext="${ts.icon}"></span>
                                                </th:block>
                                                <th:block th:unless="${ts.iconIsSvgCode()}">
                                                    <img th:src="@{/icons/tools/__${ts.icon}__}" alt="icon"
                                                         onerror="this.style.display='none'">
                                                </th:block>
                                            </div>
                                            <span class="tool-item-name" th:text="${ts.name}"></span>
                                            <span class="tool-item-count warn-text" th:if="${not ts.enabled}">工具集已禁用，暂不可用</span>
                                            <span class="tool-item-count" th:if="${ts.enabled}"
                                                  th:text="${#lists.size(ts.tools)} + ' 个方法'"></span>
                                        </div>
                                        <span class="tool-item-desc" th:text="${ts.description}"></span>
                                    </label>
                                </th:block>
                                <!-- 插件已禁用：仍保留勾选状态（重新启用后即恢复），但标明当前不可用 -->
                                <th:block th:unless="${p.enabled}">
                                    <label th:each="tsName : ${p.toolSetNames}" class="checkbox-item checkbox-item-unavailable">
                                        <div class="tool-item-row">
                                            <input type="checkbox" name="tools" th:value="${tsName}"
                                                   class="edit-tool-checkbox-fragment"
                                                   th:checked="${agent.tools != null and #strings.contains(agent.tools, tsName)}">
                                            <div class="tool-item-icon">
                                                <span class="tool-item-icon-placeholder">🚫</span>
                                            </div>
                                            <span class="tool-item-name" th:text="${tsName}"></span>
                                            <span class="tool-item-count warn-text">插件已禁用，暂不可用</span>
                                        </div>
                                    </label>
                                </th:block>
                            </div>
                            <!-- 内置工具：无插件父节点 -->
                            <div class="tool-group" th:if="${not #lists.isEmpty(builtinToolSets)}">
                                <div class="tool-group-header">
                                    <span class="tool-group-name">内置工具</span>
                                </div>
                                <label th:each="ts : ${builtinToolSets}" class="checkbox-item"
                                       th:classappend="${ts.enabled ? null : ' checkbox-item-unavailable'}">
                                    <div class="tool-item-row">
                                        <input type="checkbox" name="tools" th:value="${ts.name}"
                                               class="edit-tool-checkbox-fragment"
                                               th:disabled="${not ts.enabled}"
                                               th:checked="${agent.tools != null and #strings.contains(agent.tools, ts.name)}">
                                        <div class="tool-item-icon">
                                            <th:block th:if="${ts.iconIsSvgCode()}">
                                                <span th:utext="${ts.icon}"></span>
                                            </th:block>
                                            <th:block th:unless="${ts.iconIsSvgCode()}">
                                                <img th:src="@{/icons/tools/__${ts.icon}__}" alt="icon"
                                                     onerror="this.style.display='none'">
                                            </th:block>
                                        </div>
                                        <span class="tool-item-name" th:text="${ts.name}"></span>
                                        <span class="tool-item-count warn-text" th:if="${not ts.enabled}">工具集已禁用，暂不可用</span>
                                        <span class="tool-item-count" th:if="${ts.enabled}"
                                              th:text="${#lists.size(ts.tools)} + ' 个方法'"></span>
                                    </div>
                                    <span class="tool-item-desc" th:text="${ts.description}"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-cancel" onclick="hideEditModalFragment()">取消</button>
            <button type="button" class="btn-submit" onclick="submitEditAgentForm(document.getElementById('editAgentFormFragment'))">保存</button>
        </div>
    </div>
</div>
</body>
</html>

<div class="cb-root" id="cbRoot">
    <!-- 触发按钮：由 JS relocate 到会话头部「更多」按钮前 -->
    <button type="button" class="cb-btn" id="cbBtn" title="会话美化" aria-label="会话美化">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 1 0 0 20 2.5 2.5 0 0 0 2.5-2.5c0-.7-.3-1.3-.6-1.8-.3-.5-.4-1-.4-1.4 0-1 .8-1.8 1.8-1.8H18a4 4 0 0 0 4-4c0-4.7-4.5-8.5-10-8.5z"/>
            <circle cx="7.5" cy="11" r="1.2" fill="currentColor" stroke="none"/>
            <circle cx="11" cy="7.5" r="1.2" fill="currentColor" stroke="none"/>
            <circle cx="15" cy="7.5" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
    </button>

    <!-- 下拉设置面板：向下展开，右对齐触发按钮 -->
    <div class="cb-panel" id="cbPanel" hidden>
        <!-- 背景色 -->
        <div class="cb-group">
            <div class="cb-group-title">背景色</div>
            <div class="cb-swatches" id="cbSwatches">
                <button type="button" class="cb-swatch" data-color="#0f172a" style="background:#0f172a" title="深海蓝"></button>
                <button type="button" class="cb-swatch" data-color="#2e1065" style="background:#2e1065" title="暮色紫"></button>
                <button type="button" class="cb-swatch" data-color="#064e3b" style="background:#064e3b" title="森林绿"></button>
                <button type="button" class="cb-swatch" data-color="#1f2328" style="background:#1f2328" title="石墨灰"></button>
                <button type="button" class="cb-swatch" data-color="#f5efe0" style="background:#f5efe0" title="暖沙"></button>
                <button type="button" class="cb-swatch" data-color="#eef2ff" style="background:#eef2ff" title="晨雾"></button>
                <button type="button" class="cb-swatch" data-color="#fdf2f8" style="background:#fdf2f8" title="樱粉"></button>
                <button type="button" class="cb-swatch" data-color="#e0f2fe" style="background:#e0f2fe" title="天青"></button>
            </div>
            <div class="cb-custom">
                <input type="color" id="cbPicker" value="#e0f2fe" title="自定义颜色">
                <button type="button" class="cb-apply" id="cbApplyColor">应用</button>
                <button type="button" class="cb-reset" id="cbResetColor">还原</button>
            </div>
        </div>

        <!-- 背景图 -->
        <div class="cb-group">
            <div class="cb-group-title">背景图</div>
            <div class="cb-image-row">
                <input type="file" id="cbImageInput" accept="image/*" hidden>
                <button type="button" class="cb-apply" id="cbUploadImage">上传图片</button>
                <button type="button" class="cb-reset" id="cbClearImage">清除</button>
            </div>
            <div class="cb-image-preview" id="cbImagePreview" hidden>
                <img id="cbImageThumb" alt="背景图预览">
                <span class="cb-image-hint">已设置背景图</span>
            </div>
        </div>

        <!-- 消息背景透明度 -->
        <div class="cb-group">
            <div class="cb-group-title">消息背景透明度</div>
            <div class="cb-range-row">
                <span class="cb-range-label">气泡</span>
                <input type="range" class="cb-range" id="cbMsgAlpha" min="0" max="100" step="1" value="100">
                <span class="cb-range-value" id="cbMsgAlphaVal">100%</span>
            </div>
            <div class="cb-range-row cb-range-reset-row">
                <button type="button" class="cb-reset" id="cbResetAlpha">重置透明度</button>
            </div>
        </div>

        <!-- 字体大小 -->
        <div class="cb-group">
            <div class="cb-group-title">消息字体大小</div>
            <div class="cb-range-row">
                <span class="cb-range-label">思考</span>
                <input type="range" class="cb-range" id="cbFontThinking" min="10" max="18" step="1" value="12" data-kind="thinking">
                <span class="cb-range-value" id="cbFontThinkingVal">12px</span>
            </div>
            <div class="cb-range-row">
                <span class="cb-range-label">普通</span>
                <input type="range" class="cb-range" id="cbFontMessage" min="12" max="26" step="1" value="14" data-kind="message">
                <span class="cb-range-value" id="cbFontMessageVal">14px</span>
            </div>
            <div class="cb-range-row">
                <span class="cb-range-label">工具按钮</span>
                <input type="range" class="cb-range" id="cbFontTool" min="12" max="22" step="1" value="14" data-kind="tool">
                <span class="cb-range-value" id="cbFontToolVal">14px</span>
            </div>
            <div class="cb-range-row cb-range-reset-row">
                <button type="button" class="cb-reset" id="cbResetFont">重置字体</button>
            </div>
        </div>
    </div>
</div>

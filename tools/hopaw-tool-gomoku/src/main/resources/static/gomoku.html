<div class="plugin-gomoku-panel" data-plugin="hopaw-tool-gomoku-1.0.0.jar">
    <div class="plugin-gomoku-header">
        <span class="plugin-gomoku-title">五子棋</span>
        <span class="plugin-gomoku-status" data-gomoku-status>待命</span>
        <span class="plugin-gomoku-actions">
            <button type="button" class="plugin-gomoku-btn" data-gomoku-restart title="重新开始" aria-label="重新开始">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
            </button>
            <button type="button" class="plugin-gomoku-btn plugin-gomoku-close" data-gomoku-close title="关闭棋盘" aria-label="关闭棋盘">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </span>
    </div>
    <div class="plugin-gomoku-board-wrap">
        <div class="plugin-gomoku-board" data-gomoku-board></div>
    </div>
</div>

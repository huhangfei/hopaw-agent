<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Qwen 通义千问品牌色背景（紫色） -->
  <rect width="100" height="100" rx="20" fill="#615CED"/>
  <!-- Qwen 标志性"通"字简笔（几何风） -->
  <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round">
    <!-- 顶部横 -->
    <path d="M22 30 L78 30"/>
    <!-- 竖 -->
    <path d="M50 30 L50 76"/>
    <!-- 左侧短横 -->
    <path d="M28 48 L72 48"/>
    <!-- 下方两点 -->
    <circle cx="38" cy="68" r="2.5" fill="white" stroke="none"/>
    <circle cx="62" cy="68" r="2.5" fill="white" stroke="none"/>
  </g>
</svg>

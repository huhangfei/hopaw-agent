<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/default}">
<head>
    <title>项目管理 - HoPaw</title>
</head>
<body>
<div layout:fragment="pageTitle">🤖 HoPaw - 项目管理</div>

<main layout:fragment="content" class="projects-container">
    <div class="projects-header">
        <h2>项目管理</h2>
        <div class="projects-toolbar">
            <div class="projects-search">
                <svg viewBox="0 0 24 24" fill="currentColor" class="search-icon">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input type="text" id="projectSearchInput" placeholder="搜索项目名称..." onkeyup="handleSearchKeyup(event)">
            </div>
            <button class="btn-add-project" onclick="showAddModal()">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                新建项目
            </button>
        </div>
    </div>

    <!-- 左右布局主体 -->
    <div class="projects-layout">
        <!-- 左侧：项目列表 -->
        <aside class="projects-sidebar">
            <div class="sidebar-scroll" id="projectsList"></div>
            <div class="projects-empty" id="projectsEmpty" style="display: none;">
                <p>暂无项目</p>
            </div>
            <div class="projects-pagination" id="projectsPagination" style="display: none;">
                <div class="pagination-btns">
                    <button class="pagination-btn" id="btnPrevPage" onclick="goToPage(currentPage - 1)">上一页</button>
                    <span class="pagination-current" id="paginationCurrent"></span>
                    <button class="pagination-btn" id="btnNextPage" onclick="goToPage(currentPage + 1)">下一页</button>
                </div>
            </div>
        </aside>

        <!-- 右侧：项目详情 -->
        <section class="project-detail" id="projectDetail">
            <div class="detail-empty" id="detailEmpty">
                <p>请从左侧选择一个项目查看详情</p>
            </div>
            <div class="detail-content" id="detailContent" style="display: none;">
                <!-- 详情头部：名称、状态、操作 -->
                <div class="detail-header">
                    <div class="detail-title-area">
                        <h3 id="detailName"></h3>
                        <span class="status-badge" id="detailStatusBadge"></span>
                        <!-- 状态流转按钮（跟随状态徽标） -->
                        <span class="status-actions" id="statusActions"></span>
                    </div>
                    <div class="detail-actions">
                        <button class="btn-icon btn-view-tasks" title="查看任务" onclick="goToTaskBoard()">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 18h4V6h-4v12zm-6 0h4V6H4v12zM16 6v12h4V6h-4z"/></svg>
                        </button>
                        <button class="btn-icon btn-edit-project" title="编辑" onclick="editCurrentProject()">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                        </button>
                        <button class="btn-icon btn-delete-project" title="删除" onclick="deleteCurrentProject()">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- 创建人/创建时间 -->
                <div class="detail-meta" id="detailMeta"></div>

                <!-- 描述 -->
                <div class="detail-section">
                    <div class="section-title">项目描述</div>
                    <div class="detail-desc md-content" id="detailDesc"></div>
                </div>

                <!-- 项目空间文件树 -->
                <div class="detail-section">
                    <div class="section-title">
                        <span>项目空间</span>
                        <span class="space-toolbar">
                            <input type="file" id="projectSpaceFileInput" multiple style="display:none" onchange="onProjectSpaceFileSelected(this)">
                            <button class="btn-space" onclick="triggerSpaceUpload('')">上传文件</button>
                            <button class="btn-space" onclick="showCreateFileModal('')">新建</button>
                            <button class="btn-space" onclick="loadProjectFiles(currentProjectId)">刷新</button>
                            <button class="btn-space" onclick="downloadAllProjectFiles()">下载全部</button>
                        </span>
                    </div>
                    <div class="space-dir-info" id="spaceDirInfo"></div>
                    <div id="detailFiles" class="detail-files"></div>
                </div>

                <!-- 任务列表（可折叠，默认展开） -->
                <div class="detail-section detail-tasks-section">
                    <div class="section-title tasks-section-header" id="tasksHeader" onclick="toggleProjectTasks()">
                        <span class="tasks-title">项目任务</span>
                        <span class="tasks-count" id="taskCount"></span>
                        <button class="btn-add-task-detail" onclick="event.stopPropagation(); showAddTaskModal(currentProjectId)" title="为当前项目新建任务">＋ 新建任务</button>
                        <span class="tasks-toggle-icon" id="tasksToggleIcon">▾</span>
                    </div>
                    <div id="detailTasks" class="detail-tasks"></div>
                </div>

                <!-- Token 用量统计（可折叠，默认展开） -->
                <div class="detail-section detail-token-section">
                    <div class="section-title token-section-header" id="tokenHeader" onclick="toggleProjectToken()">
                        <span class="token-title">Token 用量</span>
                        <span class="token-stats-summary" id="projectTokenSummary" onclick="event.stopPropagation()"></span>
                        <span class="token-toggle-icon" id="tokenToggleIcon">▾</span>
                    </div>
                    <div class="token-chart-wrap" id="projectTokenChart"></div>
                </div>

                <!-- 操作日志（可折叠） -->
                <div class="detail-section detail-logs-section">
                    <div class="section-title logs-section-header" id="logsHeader" onclick="toggleProjectLogs()">
                        <span class="logs-title">操作日志</span>
                        <span class="logs-count" id="logsCount"></span>
                        <div class="log-filter-toggle" id="logFilterToggle" onclick="event.stopPropagation()">
                            <button type="button" class="log-filter-btn active" data-filter="all" onclick="switchLogFilter('all', event)">全部</button>
                            <button type="button" class="log-filter-btn" data-filter="important" onclick="switchLogFilter('important', event)">重点</button>
                        </div>
                        <span class="logs-toggle-icon" id="logsToggleIcon">▾</span>
                    </div>
                    <div class="logs-body" id="detailLogs"></div>
                    <div class="logs-pagination" id="logsPagination" style="display: none;">
                        <div class="pagination-btns">
                            <button class="pagination-btn" id="btnLogPrevPage" onclick="goToLogPage(logsPage - 1)">上一页</button>
                            <span class="pagination-current" id="logsPaginationCurrent"></span>
                            <button class="pagination-btn" id="btnLogNextPage" onclick="goToLogPage(logsPage + 1)">下一页</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- 新建/编辑项目模态框 -->
    <div class="modal-overlay" id="projectModal">
        <div class="modal" style="max-width: 560px;">
            <div class="modal-header">
                <h3 id="projectModalTitle">新建项目</h3>
                <button class="modal-close" onclick="closeProjectModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="projectForm">
                    <input type="hidden" id="projectId">
                    <div class="form-group">
                        <label for="projectName">项目名称 *</label>
                        <input type="text" id="projectName" placeholder="请输入项目名称">
                    </div>
                    <div class="form-group">
                        <label for="projectDescription">项目描述</label>
                        <textarea id="projectDescription" rows="4" placeholder="请输入项目描述"></textarea>
                    </div>
                    <div class="form-group" id="spaceModeGroup">
                        <label>项目空间</label>
                        <div class="space-type-radio">
                            <label><input type="radio" name="spaceMode" value="auto" checked onchange="onSpaceModeChange()"> 自动创建</label>
                            <label><input type="radio" name="spaceMode" value="local" onchange="onSpaceModeChange()"> 使用本地目录</label>
                        </div>
                        <div id="localSpaceBox" style="display:none; margin-top:8px;">
                            <input type="text" id="projectLocalSpaceDir" placeholder="请输入本地目录绝对路径，如 D:\my-project" style="width:100%;">
                            <small style="color:#999;">将该本地目录作为项目空间，目录不存在时会自动创建</small>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeProjectModal()">取消</button>
                <button class="btn-submit" onclick="submitProject()">保存</button>
            </div>
        </div>
    </div>

    <!-- 新建文件/目录模态框 -->
    <div class="modal-overlay" id="spaceCreateModal">
        <div class="modal" style="max-width: 420px;">
            <div class="modal-header">
                <h3 id="spaceCreateModalTitle">新建</h3>
                <button class="modal-close" onclick="Modal.close('spaceCreateModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="spaceCreateForm">
                    <div class="form-group">
                        <label>类型</label>
                        <div class="space-type-radio">
                            <label><input type="radio" name="spaceCreateType" value="directory" checked> 目录</label>
                            <label><input type="radio" name="spaceCreateType" value="file"> 文件</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="spaceCreateName">名称 *</label>
                        <input type="text" id="spaceCreateName" placeholder="请输入名称">
                    </div>
                    <div class="form-group" id="spaceCreatePathGroup">
                        <label>创建位置</label>
                        <code id="spaceCreatePath" class="space-create-path">/</code>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="Modal.close('spaceCreateModal')">取消</button>
                <button class="btn-submit" onclick="submitSpaceCreate()">创建</button>
            </div>
        </div>
    </div>

    <!-- 移动/重命名模态框 -->
    <div class="modal-overlay" id="spaceMoveModal">
        <div class="modal" style="max-width: 420px;">
            <div class="modal-header">
                <h3>重命名</h3>
                <button class="modal-close" onclick="Modal.close('spaceMoveModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="spaceMoveForm">
                    <input type="hidden" id="spaceMoveFrom">
                    <div class="form-group">
                        <label>当前路径</label>
                        <input type="text" id="spaceMoveCurrentPath" readonly>
                    </div>
                    <div class="form-group">
                        <label for="spaceMoveName">新名称 *</label>
                        <input type="text" id="spaceMoveName" placeholder="请输入新名称">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="Modal.close('spaceMoveModal')">取消</button>
                <button class="btn-submit" onclick="submitSpaceMove()">确定</button>
            </div>
        </div>
    </div>

    <!-- 文件预览模态框 -->
    <div class="modal-overlay" id="projectFilePreviewModal">
        <div class="modal modal-wide project-file-preview-card">
            <div class="modal-header">
                <h3 id="previewModalTitle">文件预览</h3>
                <div class="preview-header-actions">
                    <button class="preview-new-tab-btn" onclick="openPreviewInNewTab()" title="在新页面打开预览">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                        <span>新页面打开</span>
                    </button>
                    <button class="modal-close" onclick="Modal.close('projectFilePreviewModal')">&times;</button>
                </div>
            </div>
            <div class="modal-body project-file-preview-body">
                <iframe id="projectFilePreviewFrame" class="project-file-preview-frame" frameborder="0"></iframe>
            </div>
        </div>
    </div>
    <!-- 新建/编辑任务模态框（公共组件，与任务看板共用） -->
    <div th:replace="~{fragment/task-modal :: taskModal}"></div>
</main>

<th:block layout:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/task-modal.css}">
    <link rel="stylesheet" th:href="@{/css/md-content.css}">
    <link rel="stylesheet" th:href="@{/css/page/projects.css}">
</th:block>

<th:block layout:fragment="extraScripts">
    <script th:src="@{/js/marked.min.js}"></script>
    <script th:src="@{/js/chart.umd.min.js}"></script>
    <script th:src="@{/js/notice.js}"></script>
    <script th:src="@{/js/page/task-modal.js}"></script>
    <script th:src="@{/js/page/projects.js}"></script>
</th:block>
</body>
</html>

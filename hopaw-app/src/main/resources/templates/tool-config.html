<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/default}">
<head>
    <title>工具配置 - HoPaw</title>
</head>
<body>
<div layout:fragment="pageTitle">🤖 HoPaw - 工具配置</div>

<div class="tool-config-container" layout:fragment="content">
    <div th:if="${success}" class="toast-success" th:text="${success}"></div>
    <div th:if="${error}" class="toast-error" th:text="${error}"></div>

    <div class="config-header">
        <a href="/tools" class="btn-back">← 返回工具列表</a>
        <h2 th:text="|${config.toolName} 配置|"></h2>
        <p class="config-desc" th:text="${config.toolDescription}"></p>
    </div>

    <form th:action="@{|/tool-config/${toolName}|}" method="post" class="config-form" id="configForm" onsubmit="return validateForm(event)">
        <div th:each="item : ${config.configItems}" class="config-item">
            <div class="config-item-header">
                <label th:text="${item.label}" class="config-label">
                    <span th:if="${item.validation != null && item.validation.required}" class="required">*</span>
                </label>
                <span th:if="${item.description}" class="config-hint" th:text="${item.description}"></span>
            </div>

            <!-- MAP 映射组结构：多个 mapKey（组），每个对应一组子配置 -->
            <div th:if="${item.structure != null && item.structure.name() == 'MAP'}" class="config-map-input"
                 th:data-key="${item.key}"
                 th:data-next-idx="${config.mapValues[item.key] != null ? config.mapValues[item.key].size() : 0}">
                <div th:each="group, gStat : ${config.mapValues[item.key]}" class="map-group">
                    <div class="map-group-header">
                        <span class="map-group-title" th:text="|组 ${gStat.index + 1}|"></span>
                        <button type="button" class="btn-remove-map-group" onclick="removeMapGroup(this)">删除组</button>
                    </div>
                    <div class="map-key-field">
                        <input type="text"
                               class="config-input map-key-input"
                               th:attr="type=${item.type != null && item.type.name() == 'TEXT_PASSWORD' ? 'password' : 'text'}"
                               th:name="|mapKey_${item.key}_${gStat.index}|"
                               th:value="${group.key}"
                               th:placeholder="|请输入${item.label}（唯一，不含逗号冒号）|">
                    </div>
                    <div class="validation-error map-key-error" th:id="|error-mapKey_${item.key}_${gStat.index}|"></div>
                    <div class="map-values">
                        <div th:each="vi : ${item.values}" class="map-value-item">
                            <div class="config-item-header">
                                <label th:text="${vi.label}" class="config-label">
                                    <span th:if="${vi.validation != null && vi.validation.required}" class="required">*</span>
                                </label>
                                <span th:if="${vi.description}" class="config-hint" th:text="${vi.description}"></span>
                            </div>
                            <th:block th:insert="~{fragment/config-field :: basicField(item=${vi}, val=${group.value[vi.key]}, namePrefix=|config_${item.key}_${gStat.index}_${vi.key}|, errKey=|${item.key}_${gStat.index}_${vi.key}|)}"/>
                            <div class="validation-error" th:id="|error-${item.key}_${gStat.index}_${vi.key}|"></div>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn-add-map-group" onclick="addMapGroup(this)">+ 添加</button>
                <!-- 空组模板：JS 克隆新增组，TPLIDX 为组序号占位 -->
                <template th:id="|mapTemplate_${item.key}|">
                    <div class="map-group">
                        <div class="map-group-header">
                            <span class="map-group-title">新组</span>
                            <button type="button" class="btn-remove-map-group" onclick="removeMapGroup(this)">删除组</button>
                        </div>
                        <div class="map-key-field">
                            <input type="text"
                                   class="config-input map-key-input"
                                   th:attr="type=${item.type != null && item.type.name() == 'TEXT_PASSWORD' ? 'password' : 'text'}"
                                   th:name="|mapKey_${item.key}_TPLIDX|"
                                   th:placeholder="|请输入${item.label}（唯一，不含逗号冒号）|">
                        </div>
                        <div class="validation-error map-key-error" th:id="|error-mapKey_${item.key}_TPLIDX|"></div>
                        <div class="map-values">
                            <div th:each="vi : ${item.values}" class="map-value-item">
                                <div class="config-item-header">
                                    <label th:text="${vi.label}" class="config-label">
                                        <span th:if="${vi.validation != null && vi.validation.required}" class="required">*</span>
                                    </label>
                                    <span th:if="${vi.description}" class="config-hint" th:text="${vi.description}"></span>
                                </div>
                                <th:block th:insert="~{fragment/config-field :: basicField(item=${vi}, val=${vi.defaultValue}, namePrefix=|config_${item.key}_TPLIDX_${vi.key}|, errKey=|${item.key}_TPLIDX_${vi.key}|)}"/>
                                <div class="validation-error" th:id="|error-${item.key}_TPLIDX_${vi.key}|"></div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- 基础单值结构 -->
            <div th:unless="${item.structure != null && item.structure.name() == 'MAP'}" class="config-input-container">
                <th:block th:insert="~{fragment/config-field :: basicField(item=${item}, val=${config.values[item.key]}, namePrefix=|config_${item.key}|, errKey=${item.key})}"/>
            </div>
            <div class="validation-error" th:if="${item.structure == null || item.structure.name() != 'MAP'}" th:id="'error-' + ${item.key}"></div>
        </div>

        <div th:if="${#lists.isEmpty(config.configItems)}" class="config-empty">
            <p>该工具暂无可用配置项</p>
        </div>

        <div class="config-actions" th:if="${not #lists.isEmpty(config.configItems)}">
            <button type="submit" class="btn-primary">保存配置</button>
        </div>
    </form>
</div>

<th:block layout:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/page/tool-config.css}">
</th:block>

<th:block layout:fragment="extraScripts">
    <script th:src="@{/js/page/tool-config.js}"></script>
</th:block>
</body>
</html>

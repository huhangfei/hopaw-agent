<div class="cb-root" id="cbRoot">
    <!-- 收起态：右下角圆钮（沙箱容器收起时只有 48×48，正好容纳本按钮） -->
    <button type="button" class="cb-fab" id="cbFab" title="会话背景色" aria-label="会话背景色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a9 9 0 1 0 0 18 3 3 0 0 0 0-6 3 3 0 0 1 0-6 9 9 0 0 0 0-6z"/>
            <circle cx="8.5" cy="10" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="7" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="15.5" cy="10" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
    </button>

    <!-- 展开态：设置面板 -->
    <div class="cb-panel" id="cbPanel" hidden>
        <div class="cb-head">
            <span class="cb-title">会话背景色</span>
            <button type="button" class="cb-close" id="cbClose" title="收起" aria-label="收起">&times;</button>
        </div>

        <div class="cb-body">
            <div class="cb-label">预设配色</div>
            <div class="cb-swatches" id="cbSwatches">
                <button type="button" class="cb-swatch" data-color="#0f172a" style="background:#0f172a" title="深海蓝"></button>
                <button type="button" class="cb-swatch" data-color="#2e1065" style="background:#2e1065" title="暮色紫"></button>
                <button type="button" class="cb-swatch" data-color="#064e3b" style="background:#064e3b" title="森林绿"></button>
                <button type="button" class="cb-swatch" data-color="#1f2328" style="background:#1f2328" title="石墨灰"></button>
                <button type="button" class="cb-swatch" data-color="#f5efe0" style="background:#f5efe0" title="暖沙"></button>
                <button type="button" class="cb-swatch" data-color="#eef2ff" style="background:#eef2ff" title="晨雾"></button>
                <button type="button" class="cb-swatch" data-color="#fdf2f8" style="background:#fdf2f8" title="樱粉"></button>
                <button type="button" class="cb-swatch" data-color="#e0f2fe" style="background:#e0f2fe" title="天青"></button>
            </div>

            <div class="cb-label">自定义</div>
            <div class="cb-custom">
                <input type="color" id="cbPicker" value="#e0f2fe" title="选择颜色">
                <button type="button" class="cb-apply" id="cbApply">应用到会话页</button>
            </div>
        </div>

        <div class="cb-foot">
            <span class="cb-current" id="cbCurrent">跟随主题</span>
            <button type="button" class="cb-reset" id="cbReset">还原</button>
        </div>
    </div>
</div>

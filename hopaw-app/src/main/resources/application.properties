# Server Configuration
server.port=8080
spring.jackson.time-zone=Asia/Shanghai
spring.profiles.active=dev
# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Multipart File Upload
spring.servlet.multipart.max-file-size=10240MB
spring.servlet.multipart.max-request-size=1024MB

# MyBatis - 让所有 profile 都能扫描到各模块的 mapper XML
# 使用 classpath*:** 通配符匹配 classpath 中所有 mapper 路径
mybatis.mapper-locations=classpath*:mapper/**/*Mapper.xml
mybatis.type-aliases-package=com.agent.hopaw.infra.model.entity,com.agent.hopaw.avatar.entity

# 附件管理配置
hopaw.attachment.dir=attachments
hopaw.attachment.url-prefix=/attachments
# Plugin Configuration
agent.plugin.dir=plugins
# 项目空间配置
# 项目空间根目录：所有项目的项目空间目录都放置在此目录下
# 每创建一个项目，会在此目录下根据项目编号创建一个子目录作为该项目的工作空间
hopaw.project.space.dir=project-spaces


<div xmlns:th="http://www.thymeleaf.org" th:fragment="content">
    <div class="settings-form avatar-rank-page">
        <div class="avatar-rank-header">
            <h3>虚拟人等级排行</h3>
            <span class="avatar-rank-count" id="avatarRankCount"></span>
        </div>
        <div class="avatar-rank-table-wrap">
            <table class="avatar-rank-table">
                <thead>
                    <tr>
                        <th class="col-rank">名次</th>
                        <th class="col-user">用户</th>
                        <th class="col-agent">智能体</th>
                        <th class="col-level">等级</th>
                        <th class="col-title">称号</th>
                        <th class="col-tokens">累计Token</th>
                    </tr>
                </thead>
                <tbody id="avatarRankBody">
                </tbody>
            </table>
            <div class="avatar-rank-empty" id="avatarRankEmpty" style="display:none;">暂无虚拟人数据</div>
        </div>
    </div>
</div>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${config.toolName} 配置|">工具配置 - HoPaw</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="stylesheet" th:href="@{/css/form.css}">
    <link rel="stylesheet" th:href="@{/css/toast.css}">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/page/tool-config.css}">
</head>
<body th:class="${currentTheme == 'dark' ? 'dark-theme' : ''}">
<div class="config-standalone">
    <div class="config-header">
        <h2 th:text="|${config.toolName} 配置|"></h2>
        <p class="config-desc" th:text="${config.toolDescription}"></p>
        <p class="config-prefix-hint" th:text="|配置键前缀：${config.configPrefix}*|"></p>
    </div>

    <form class="config-form" id="configForm"
          th:attr="data-api-action=|/tool-config/api/${toolName}|"
          onsubmit="return submitConfigForm(event)">
        <div th:replace="~{fragment/config-form :: configItems(${config})}"></div>
    </form>
</div>

<div id="toast-container" class="toast-container"></div>

<script th:src="@{/js/toast.js}"></script>
<script th:src="@{/js/page/tool-config.js}"></script>
</body>
</html>

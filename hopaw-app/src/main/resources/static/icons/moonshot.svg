<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Moonshot 月之暗面品牌色背景（深色） -->
  <rect width="100" height="100" rx="20" fill="#1A1A2E"/>
  <!-- 月之暗面 logo：月牙 + 闪光 -->
  <g fill="white">
    <!-- 月牙：用两圆相减形成 -->
    <path d="M 38 25 A 26 26 0 1 0 38 75 A 20 20 0 1 1 38 25 Z" fill="white"/>
    <!-- 闪光/星点 -->
    <circle cx="72" cy="30" r="3"/>
    <circle cx="78" cy="42" r="2"/>
    <circle cx="68" cy="50" r="2.5"/>
  </g>
</svg>
